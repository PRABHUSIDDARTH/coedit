name: coedit

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-coedit}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run make env}
  POSTGRES_DB: ${POSTGRES_DB:-coedit}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    # Published on loopback only: the database must not be reachable from the network.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]  # 5433 on the host: 5432 is often taken
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coedit}:${POSTGRES_PASSWORD:?run make env}@db:5432/${POSTGRES_DB:-coedit}
      BLOB_DIR: /data/blobs
    volumes: [blobs:/data/blobs]
    # Linux has no host.docker.internal by default; this makes the Ollama preset work there too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]  # loopback only; the web container reaches it as api:8000
    depends_on:
      db: { condition: service_healthy }

  sync:
    build: ./sync
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-coedit}:${POSTGRES_PASSWORD:?run make env}@db:5432/${POSTGRES_DB:-coedit}
      PORT: "1234"
    ports: ["127.0.0.1:1234:1234"]  # loopback only (see README "Network exposure")
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      # The Next server proxies /api here. The browser opens the sync WebSocket itself, on port 1234
      # of the same host (the API tells it "/sync"; the app maps that to :1234).
      API_TARGET: http://api:8000
    ports: ["5173:3000"]  # kept on 5173, the address everything else already uses
    depends_on: [api, sync]

volumes:
  pgdata:
  blobs:
